# Paper-location hints for analysis/generate_provenance.jl.
#
# One entry per section tag emitted by analysis/paper_values.jl. Each
# entry has:
#   default_location: free-text paper location applied to every claim in
#                     the section unless per_claim overrides.
#   notes:            free-text note surfaced once per section in
#                     PROVENANCE.md (optional).
#   per_claim:        map of claim_id -> paper_location for claims that
#                     need a more precise location than default_location
#                     (optional).
#
# Paper-location strings should be human-readable. Typical patterns:
#   "§5.2, Table 2"
#   "§5.2, Table 2, row 'R750 app view', column 'min'"
#   "§5.2 prose, paragraph 2"
#   "§9, second paragraph, sentence 3"
#
# "[LOCATION TBD]" is the escape hatch for claims whose paper location is
# unknown at hints-write time. In strict mode (the default for
# regeneration) the generator fails on any [LOCATION TBD] it resolves. In
# build mode (--allow-tbd) the generator permits them and reports a
# summary of unresolved claims at the end of the run.
#
# Claims flow one-way: CSVs -> paper_values.jl -> paper_values.json ->
# PROVENANCE.md -> paper prose. If this hints file disagrees with the
# paper draft, the draft wins for locations; re-edit the hint. If the
# hints file disagrees with paper_values.json about which section tags
# exist, the generator fails loud.

sections:

  # ============================================================
  # §5 Network Fabric Characterisation
  # ============================================================

  "5.2.table2":
    default_location: "§5.2, Table 2"
    notes: ""

  "5.2.prose":
    default_location: "§5.2 prose"
    notes: "sec5_2_prose_r750_perstore_min_gbps and sec5_2_prose_r750_perstore_max_gbps are cited in v41 at two locations: §5.2 line 437 (the two-view R750 throughput statement) and §5.5 line 555 (the NUMA-context recap). The default location is §5.2; §5.5 reuses the values. Cross-reference recorded in decisions/2026-05-23_01.md."

  "5.3.table3":
    default_location: "§5.3, Table 3"
    notes: ""

  "5.3.prose":
    default_location: "§5.3 prose"
    notes: "The 60 s regime-change claim is a qualitative Figure 5 observation, not a tabular value."

  "5.4.table4":
    default_location: "§5.4, Table 4"
    notes: ""

  "5.4.prose":
    default_location: "§5.4 prose"
    notes: ""

  "5.5.table5":
