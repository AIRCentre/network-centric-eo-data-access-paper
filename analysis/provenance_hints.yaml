      sec5_5_table5_stinbound_throughput_per_node:
        "§5.5, Table 5, row 'Storage-inbound', column 'Throughput per node'"
      sec5_5_table5_ststst_throughput_per_node:
        "§5.5, Table 5, row 'St-to-st', column 'Throughput per node'"
      sec5_5_table5_appoutbound_throughput_per_node:
