  "5.5.table5a":
    default_location: "§5.5, Table 5a, row 'R7615 (modelling)', column 'Mem BW (GB/s)'"
    notes: "Table 5a in v8 §5.5 is a distinct table ('Memory architecture and theoretical network saturation by node class'). Values appear as '~51', '~307', '~154' in the 'Mem BW (GB/s)' column."

  "5.5.table5b":
